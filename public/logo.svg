<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6C3CE0"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)"/>
  <!-- Eye white (outer shape) -->
  <path d="M32 18C20 18 12 32 12 32s8 14 20 14 20-14 20-14-8-14-20-14z" fill="rgba(255,255,255,0.95)"/>
  <!-- Iris -->
  <circle cx="32" cy="32" r="9" fill="#1E1B4B"/>
  <!-- Pupil -->
  <circle cx="32" cy="32" r="4.5" fill="#6C3CE0"/>
  <!-- Focus crosshair ring -->
  <circle cx="32" cy="32" r="7" fill="none" stroke="#3B82F6" stroke-width="1.2" stroke-dasharray="3 3"/>
  <!-- Crosshair lines -->
  <line x1="32" y1="23" x2="32" y2="27" stroke="rgba(255,255,255,0.7)" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="32" y1="37" x2="32" y2="41" stroke="rgba(255,255,255,0.7)" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="23" y1="32" x2="27" y2="32" stroke="rgba(255,255,255,0.7)" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="37" y1="32" x2="41" y2="32" stroke="rgba(255,255,255,0.7)" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Light reflection on eye -->
  <circle cx="35" cy="29" r="2" fill="rgba(255,255,255,0.6)"/>
</svg>
