<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Eye almond - brighter orange stroke -->
  <ellipse cx="32" cy="32" rx="26" ry="16" stroke="#FF8C00" stroke-width="2"/>
  <!-- Corner ticks -->
  <line x1="6" y1="32" x2="12" y2="32" stroke="#FF8C00" stroke-width="2" stroke-linecap="round"/>
  <line x1="52" y1="32" x2="58" y2="32" stroke="#FF8C00" stroke-width="2" stroke-linecap="round"/>
  <!-- Iris ring -->
  <circle cx="32" cy="32" r="13" stroke="#FF8C00" stroke-width="1.5" opacity="0.7"/>
  <!-- Pupil - filled with solid orange -->
  <circle cx="32" cy="32" r="8" fill="#FF8C00"/>
  <!-- Inner pupil detail -->
  <circle cx="32" cy="32" r="4" fill="#0C0A07"/>
  <!-- Radial detail lines -->
  <line x1="42" y1="32" x2="45" y2="32" stroke="#FF8C00" stroke-width="1" opacity="0.8"/>
  <line x1="38.5" y1="38.5" x2="41" y2="41" stroke="#FF8C00" stroke-width="1" opacity="0.8"/>
  <line x1="32" y1="42" x2="32" y2="45" stroke="#FF8C00" stroke-width="1" opacity="0.8"/>
  <line x1="25.5" y1="38.5" x2="23" y2="41" stroke="#FF8C00" stroke-width="1" opacity="0.8"/>
  <!-- Glint - bright white/orange -->
  <circle cx="35" cy="29" r="2.5" fill="#FFD700"/>
</svg>