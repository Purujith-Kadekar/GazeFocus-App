<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'" />
  <title>Sign in to GazeFocus</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #0d0d10;
      color: #f4f4f5;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .card { width: 320px; }
    .logo {
      width: 44px; height: 44px; border-radius: 10px;
      background: #D4870A; display: flex; align-items: center;
      justify-content: center; font-weight: 800; font-size: 22px;
      color: #fff; margin: 0 auto 14px;
    }
    h1 { font-size: 18px; text-align: center; margin-bottom: 4px; }
    p.sub { font-size: 12px; color: #a1a1aa; text-align: center; margin-bottom: 22px; }
    label { display: block; font-size: 12px; color: #a1a1aa; margin: 12px 0 5px; }
    input {
      width: 100%; padding: 10px 12px; border-radius: 8px;
      border: 1px solid #27272a; background: #18181b; color: #f4f4f5;
      font-size: 14px; outline: none;
    }
    input:focus { border-color: #D4870A; }
    button {
      width: 100%; margin-top: 20px; padding: 11px; border: none;
      border-radius: 8px; background: #D4870A; color: #fff;
      font-size: 14px; font-weight: 600; cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: wait; }
    .error {
      display: none; margin-top: 12px; padding: 9px 11px; border-radius: 8px;
      background: #7f1d1d33; border: 1px solid #b91c1c66; color: #fca5a5;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">G</div>
    <h1>GazeFocus Agent</h1>
    <p class="sub">Sign in so your agent can watch deadlines<br/>and send you priority notifications.</p>

    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="email" placeholder="you@example.com" />
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" />

    <div class="error" id="error"></div>
    <button id="submit">Sign in</button>
  </div>

  <script>
    const $ = (id) => document.getElementById(id)
    const errorBox = $('error')

    function showError(msg) {
      errorBox.textContent = msg
      errorBox.style.display = 'block'
      $('submit').disabled = false
    }

    async function submit() {
      const email = $('email').value.trim()
      const password = $('password').value
      if (!email || !password) return showError('Enter your email and password.')

      $('submit').disabled = true
      errorBox.style.display = 'none'
      const result = await window.gazefocus.login(email, password)
      if (result.ok) {
        // main.js opens the app window once auth succeeds.
        $('submit').textContent = 'Signed in ✓'
      } else if (result.error === 'email-not-verified') {
        showError('Please verify your email first (check your inbox), then try again.')
      } else if (result.error === 'network') {
        showError('Could not reach the server. Check your connection.')
      } else {
        showError('Invalid email or password.')
      }
    }

    $('submit').addEventListener('click', submit)
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') submit()
    })
  </script>
</body>
</html>
